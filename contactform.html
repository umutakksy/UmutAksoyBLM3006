<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>İletişim Formu — Abdullah Görgen</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="nav-logo">AG<span>.</span></a>
      <ul class="nav-links">
        <li><a href="index.html">Ana Sayfa</a></li>
        <li><a href="about.html">Hakkımda</a></li>
        <li><a href="interests.html">İlgi Alanlarım</a></li>
        <li><a href="contact.html">İletişim</a></li>
        <li><a href="contactform.html" class="active">Form</a></li>
        <li>
          <select id="labSelector" style="padding: 6px 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 0.9rem; cursor: pointer; margin-left: 10px;">
            <option value="" selected disabled>Lab Seçiniz</option>
            <option value="2">Lab 2</option>
            <option value="3">Lab 3</option>
            <option value="5">Lab 5</option>
            <option value="6-1">Lab 6.1</option>
            <option value="6-2">Lab 6.2</option>
            <option value="7">Lab 7</option>
          </select>
        </li>
      </ul>
    </div>
  </nav>

  <!-- SAYFA BAŞLIĞI -->
  <div class="page-hero">
    <div class="container">
      <span class="eyebrow">Bize Ulaşın</span>
      <h1>Detaylı İletişim Formu</h1>
      <p>Aşağıdaki formu doldurarak mesajınızı iletebilirsiniz.</p>
    </div>
  </div>

  <div class="page-body">
    <div class="container" style="max-width: 720px;">
      <div class="card">
        <form action="#" method="POST">

          <!-- Ad Soyad -->
          <div class="form-group">
            <label class="form-label" for="fullname">Ad Soyad</label>
            <input class="form-control" type="text" id="fullname" name="fullname"
                   placeholder="Örn: Abdullah Görgen" required />
          </div>

          <!-- E-posta -->
          <div class="form-group">
            <label class="form-label" for="email">E-posta Adresi</label>
            <input class="form-control" type="email" id="email" name="email"
                   placeholder="ornek@mail.com" required />
          </div>

          <!-- Şifre -->
          <div class="form-group">
            <label class="form-label" for="password">Başvuru Takip Şifresi</label>
            <input class="form-control" type="password" id="password" name="password"
                   placeholder="Şifrenizi girin" />
          </div>

          <!-- İletişim tercihi -->
          <div class="form-group">
            <label class="form-label">İletişim Tercihi</label>
            <div class="options-group">
              <label class="option-item">
                <input type="radio" name="contact_method" value="email" checked />
                Bana e-posta ile ulaşın
              </label>
              <label class="option-item">
                <input type="radio" name="contact_method" value="phone" />
                Bana telefonla ulaşın
              </label>
            </div>
          </div>

          <!-- İlgi Alanları -->
          <div class="form-group">
            <label class="form-label">İlgi Alanları / Yetenekler</label>
            <div class="options-group">
              <label class="option-item">
                <input type="checkbox" name="skills" value="html" />
                HTML
              </label>
              <label class="option-item">
                <input type="checkbox" name="skills" value="css" />
                CSS
              </label>
              <label class="option-item">
                <input type="checkbox" name="skills" value="algorithm" />
                Algoritma
              </label>
            </div>
          </div>

          <!-- Konu -->
          <div class="form-group">
            <label class="form-label" for="subject">Konu</label>
            <select class="form-control" id="subject" name="subject" required>
              <option value="" disabled selected>Lütfen bir konu seçin...</option>
              <option value="is_teklifi">İş Teklifi</option>
              <option value="soru">Soru</option>
              <option value="geri_bildirim">Geri Bildirim</option>
            </select>
          </div>

          <!-- CV Yükleme -->
          <div class="form-group">
            <label class="form-label" for="resume">Özgeçmiş (CV) veya Fotoğraf Yükle</label>
            <div class="file-input-wrapper">
              <input type="file" id="resume" name="resume" />
            </div>
          </div>

          <!-- Mesaj -->
          <div class="form-group">
            <label class="form-label" for="message">Mesajınız</label>
            <textarea class="form-control" id="message" name="message" rows="5"
                      placeholder="Detaylı mesajınızı buraya yazabilirsiniz..." required></textarea>
          </div>

          <!-- Butonlar -->
          <div class="btn-group">
            <button type="submit" class="btn btn-primary">Gönder</button>
            <button type="reset"  class="btn btn-danger">Temizle</button>
          </div>

        </form>
      </div>

      <div style="margin-top: 24px;">
        <a href="contact.html" class="btn btn-ghost">← İletişim Sayfasına Dön</a>
      </div>
    </div>
  </div>

  <footer class="site-footer">
    <div class="container">
      <p>© 2026 Abdullah Görgen — Web Programlama Dersi</p>
    </div>
  </footer>


  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const labSelector = document.getElementById('labSelector');
      if (labSelector) {
        labSelector.addEventListener('change', function() {
          if (this.value) {
            window.location.href = `lab${this.value}.html`;
          }
        });
      }
    });
  </script>
</body>
</html>
